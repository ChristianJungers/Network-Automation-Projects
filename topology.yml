lab:
  title: "Automation_Lab_1"
  description: "3 Router 2 Switch Automation Lab"
  notes: "Created via Ansible"
  version: "0.1.0"
nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        type: physical
  - id: n1
    label: R2
    node_definition: iosv
    x: 100
    y: 0
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        type: physical
  - id: n2
    label: R3
    node_definition: iosv
    x: 200
    y: 0
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        type: physical
  - id: n3
    label: SW1
    node_definition: iosvl2
    x: 50
    y: 100
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        type: physical
      - id: i0
        label: GigabitEthernet0/0
        type: physical
      - id: i3
        label: GigabitEthernet0/3
        type: physical
  - id: n4
    label: SW2
    node_definition: iosvl2
    x: 150
    y: 100
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
      - id: i0
        label: GigabitEthernet0/0
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        type: physical
      - id: i3
        label: GigabitEthernet0/3
        type: physical
  - id: n5
    label: EXT-CONN
    node_definition: external_connector
    x: 100
    y: -200
    configuration: System Bridge
    interfaces:
      - id: i0
        label: port
        type: physical
  - id: n6
    label: MGMT-SW
    node_definition: unmanaged_switch
    x: 100
    y: -100
    interfaces:
      - id: i0
        label: port0
        type: physical
      - id: i1
        label: port1
        type: physical
      - id: i2
        label: port2
        type: physical
      - id: i3
        label: port3
        type: physical
      - id: i4
        label: port4
        type: physical
      - id: i5
        label: port5
        type: physical

links:
  # R1 to SW1
  - id: l0
    n1: n0
    i1: i1
    n2: n3
    i2: i1
  # R2 to SW1  
  - id: l1
    n1: n1
    i1: i1
    n2: n3
    i2: i2
  # R2 to SW2
  - id: l2
    n1: n1
    i1: i2
    n2: n4
    i2: i1
  # R3 to SW2 
  - id: l3
    n1: n2
    i1: i1
    n2: n4
    i2: i2
  # SW1 to SW2 
  - id: l4
    n1: n3
    i1: i0
    n2: n4
    i2: i0
  # R1 to MGMT-SW
  - id: l5
    n1: n0
    i1: i0
    n2: n6
    i2: i0
  # R2 to MGMT-SW
  - id: l6
    n1: n1
    i1: i0
    n2: n6
    i2: i1
  #R3 to MGMT-SW
  - id: l7
    n1: n2
    i1: i0
    n2: n6
    i2: i2
  # EXT-CONN to MGMT-SW
  - id: l8
    n1: n6
    i1: i3
    n2: n5
    i2: i0 
  # SW1 to MGMT-SW
  - id: l9
    n1: n3
    i1: i3
    n2: n6
    i2: i4
  # SW2 to MGMT-SW
  - id: l10
    n1: n4
    i1: i3
    n2: n6
    i2: i5