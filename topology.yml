lab:
  title: "Automation_Lab_1"
  description: "3 Router 2 Switch Automation Lab"
  notes: "Created via Ansible"
  version: "0.1.0"
nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
  - id: n1
    label: R2
    node_definition: iosv
    x: 100
    y: 0
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
  - id: n2
    label: R3
    node_definition: iosv
    x: 200
    y: 0
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
  - id: n3
    label: SW1
    node_definition: iosvl2
    x: 50
    y: 100
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        type: physical
      - id: i0
        label: GigabitEthernet0/0
        type: physical
  - id: n4
    label: SW2
    node_definition: iosvl2
    x: 150
    y: 100
    interfaces:
      - id: i1
        label: GigabitEthernet0/1
        type: physical
      - id: i0
        label: GigabitEthernet0/0
        type: physical
links:
  - id: l0
    n1: n0
    i1: i1
    n2: n3
    i2: i1
  - id: l1
    n1: n1
    i1: i1
    n2: n3
    i2: i2
  - id: l2
    n1: n2
    i1: i1
    n2: n4
    i2: i1
  - id: l3
    n1: n3
    i1: i0
    n2: n4
    i2: i0