---
- name: Phase 1 - Deploy CML Infastrucutre
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - vars.yml

  tasks:
    - name: Deploy topology from file
      cisco.cml.cml_lab:
        host: "{{ cml_host }}"
        user: "{{ cml_username }}"
        password: "{{ cml_password }}"
        lab: "{{ cml_lab_name }}"
        state: present
        file: "topology.yml"
        validate_certs: false
